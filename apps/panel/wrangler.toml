# Cloudflare Pages — konfiguracja projektu `udappnew` (SvelteKit).
#
# `name` ma być RÓWNE nazwie projektu w panelu Cloudflare. Stare `udapp`
# zostało po repozytorium aurabroker/udapp, z którego panel został wciągnięty
# do tego monorepo; nowy projekt Pages buduje się z aurabroker/ud i nazywa
# `udappnew`.
#
# nodejs_compat jest WYMAGANE (unpdf / Web Crypto / bufory).
name = "udappnew"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]
pages_build_output_dir = ".svelte-kit/cloudflare"

# ── Zmienne jawne ────────────────────────────────────────────────────────────
#
# UWAGA, to nie jest kwestia gustu: **od momentu, gdy ten plik istnieje, panel
# Cloudflare przestaje mieć znaczenie dla zwykłych zmiennych.** Dokumentacja
# Pages: „This file becomes the source of truth when used, meaning that you
# can not edit the same fields in the dashboard once you are using this file."
# `vars` jest jednym z tych pól.
#
# Kosztowało to jeden nieudany wieczór: sekrety wpisane w panelu działały,
# a te same trzy zmienne jawne wpisane obok wracały z /health jako MISSING —
# bo sekretami wrangler nie zarządza, a zmiennymi jawnymi tak.
#
# Te wartości nie są sekretami. Klucz anon i adres projektu Supabase widać
# w źródle każdej strony, która z nich korzysta.
[vars]
PUBLIC_SUPABASE_URL = "https://kukvgsjrmrqtzhkszzum.supabase.co"
PUBLIC_APP_URL = "https://app.utratadochodu.pl"
PIN_TTL_HOURS = "48"
RESEND_FROM = "UtrataDochodu <info@utratadochodu.pl>"

